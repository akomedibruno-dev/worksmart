<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — Work Smart</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x2615;</text></svg>">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2C3E50 0%, #1a252f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: #1a252f;
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .emoji { font-size: 4em; margin-bottom: 20px; }
        h1 { font-size: 1.6em; font-weight: 800; margin-bottom: 12px;
             background: linear-gradient(135deg,#3498db,#2ecc71);
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        p { color: #95a5a6; margin-bottom: 30px; line-height: 1.6; }
        a {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="box">
        <div class="emoji">☕</div>
        <h1>Page introuvable</h1>
        <p>Cette page n'existe pas ou a été déplacée.<br>Retournez à l'accueil pour continuer à travailler intelligemment !</p>
        <a href="/">← Retour à Work Smart</a>
    </div>
</body>
</html>
